<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Engram</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="engram-popup">

    <!-- Header -->
    <div class="header">
      <span class="logo">⬡ Engram</span>
      <span class="version">v0.1</span>
    </div>

    <!-- Health Score -->
    <div class="health-section">
      <div class="health-bar-wrap">
        <div class="health-bar" id="healthBar"></div>
      </div>
      <div class="health-meta">
        <span id="healthLabel">Checking...</span>
        <span id="healthScore">--</span>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat">
        <span class="stat-value" id="msgCount">0</span>
        <span class="stat-label">Messages</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="codeCount">0</span>
        <span class="stat-label">Code blocks</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="handoffCount">0</span>
        <span class="stat-label">Handoffs</span>
      </div>
    </div>

    <!-- Project -->
    <div class="project-section">
      <span class="section-label">Project</span>
      <span class="project-name" id="projectName">No active project</span>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="btn btn-primary" id="btnHandoff">
        ⬡ Generate Handoff
      </button>
      <button class="btn btn-secondary" id="btnNewProject">
        + New Project
      </button>
    </div>

    <!-- Status -->
    <div class="status-bar" id="statusBar"></div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
